[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iacpaas-mcp-agent"
version = "0.1.0"
description = "MCP-сервер и агент для инфоресурсов IACPaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx2>=2.14,<3",
    "pydantic>=2.7,<3",
]

[project.scripts]
iacpaas-mcp = "iacpaas_mcp.__main__:main"
iacpaas-agent = "iacpaas_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iacpaas_mcp", "src/iacpaas_agent"]
