[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iacpaas-mcp-agent"
version = "0.1.0"
description = "MCP-сервер и агент для инфоресурсов IACPaaS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1,<5",
    "httpx2>=2.14,<3",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
iacpaas-mcp = "iacpaas_mcp.__main__:main"
iacpaas-agent = "iacpaas_agent.__main__:main"
iacpaas-web = "iacpaas_web.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iacpaas_mcp", "src/iacpaas_agent", "src/iacpaas_web"]
