<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IACPaaS Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">IACPaaS Chat</div>
    <div class="status">
      <span id="model" class="pill">модель: …</span>
      <span id="prompt" class="pill">контракт: …</span>
      <span class="pill">temperature 0</span>
      <span class="pill">история: SQLite</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span class="label">Чаты</span>
        <button id="new-chat" class="ghost" type="button">+ Новый</button>
      </div>
      <div id="chat-list" class="chat-list"></div>
    </aside>

    <main class="main">
      <section id="messages" class="messages" aria-live="polite">
        <div id="empty" class="empty">
          <h1>Чат по инфоресурсам IACPaaS</h1>
          <p>Ответы строятся только по результатам MCP-тулзов и проверяются валидатором.</p>
          <div class="chips">
            <button class="chip" type="button" data-question="Сколько вершин в ИР «Пример»?">Сколько вершин в ИР «Пример»?</button>
            <button class="chip" type="button" data-question="Найди вершину «Наблюдение» в ИР «Пример»">Найди вершину «Наблюдение» в ИР «Пример»</button>
          </div>
        </div>
      </section>

      <form id="composer" class="composer">
        <textarea id="question" rows="1" placeholder="Введите вопрос..." aria-label="Вопрос"></textarea>
        <button id="send" type="submit">Отправить</button>
      </form>
      <div class="footnote">История сохраняется в SQLite; в модель уходят только ходы в пределах 128k контекста.</div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
